<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .lab { font-size: 16px; fill: #333333; }
    .val { font-size: 16px; fill: #262626; font-weight: bold; }
    .tick { font-size: 14px; fill: #666666; }
    .note { font-size: 15px; fill: #666666; }
  </style>
  <rect x="0" y="0" width="1500" height="800" fill="#ffffff"/>

  <!-- 条形区：x 420~1300，满值宽 880 -->
  <line x1="420" y1="695" x2="1300" y2="695" stroke="#404040" stroke-width="1.2"/>
  <text class="tick" x="420" y="722" text-anchor="middle">0%</text>
  <text class="tick" x="640" y="722" text-anchor="middle">25%</text>
  <text class="tick" x="860" y="722" text-anchor="middle">50%</text>
  <text class="tick" x="1080" y="722" text-anchor="middle">75%</text>
  <text class="tick" x="1300" y="722" text-anchor="middle">100%</text>
  <line x1="640" y1="695" x2="640" y2="703" stroke="#404040" stroke-width="1"/>
  <line x1="860" y1="695" x2="860" y2="703" stroke="#404040" stroke-width="1"/>
  <line x1="1080" y1="695" x2="1080" y2="703" stroke="#404040" stroke-width="1"/>

  <!-- 1 78.2% -->
  <rect x="420" y="68" width="688.2" height="44" fill="#8C5230"/>
  <text class="lab" x="400" y="97" text-anchor="end">二手相机成色与功能状态描述不统一</text>
  <text class="val" x="1120" y="97">78.2%（n=68）</text>

  <!-- 2 64.4% -->
  <rect x="420" y="168" width="566.7" height="44" fill="#A97456"/>
  <text class="lab" x="400" y="197" text-anchor="end">胶卷有效期与储存条件信息不足</text>
  <text class="val" x="998" y="197">64.4%（n=56）</text>

  <!-- 3 59.8% -->
  <rect x="420" y="268" width="526.2" height="44" fill="#C08962"/>
  <text class="lab" x="400" y="297" text-anchor="end">品牌、画幅、感光度等多维组合筛选效率低</text>
  <text class="val" x="958" y="297">59.8%（n=52）</text>

  <!-- 4 55.2% -->
  <rect x="420" y="368" width="485.8" height="44" fill="#D09F7E"/>
  <text class="lab" x="400" y="397" text-anchor="end">商品实拍图不足以判断真实状况</text>
  <text class="val" x="918" y="397">55.2%（n=48）</text>

  <!-- 5 47.1% -->
  <rect x="420" y="468" width="414.5" height="44" fill="#D9B49A"/>
  <text class="lab" x="400" y="497" text-anchor="end">交易保障与售后机制模糊</text>
  <text class="val" x="846" y="497">47.1%（n=41）</text>

  <!-- 6 41.4% -->
  <rect x="420" y="568" width="364.3" height="44" fill="#E3C9B5"/>
  <text class="lab" x="400" y="597" text-anchor="end">二手价格不透明、比价困难</text>
  <text class="val" x="796" y="597">41.4%（n=36）</text>

  <text class="note" x="420" y="660">注：本题为多选题，样本量 n=87。</text>
</svg>
