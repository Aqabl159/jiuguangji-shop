<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#404040"/>
    </marker>
    <marker id="arrOpen" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#ffffff" stroke="#404040" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .head { font-size: 17px; font-weight: bold; }
    .msg { font-size: 16px; }
    .frame { font-size: 16px; fill: #8C5230; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="1600" height="1100" fill="#ffffff"/>

  <!-- 生命线头部 -->
  <g stroke="#404040" stroke-width="1.5" fill="#ffffff">
    <rect x="30" y="30" width="200" height="48"/>
    <rect x="420" y="30" width="200" height="48"/>
    <rect x="810" y="30" width="200" height="48"/>
    <rect x="1200" y="30" width="200" height="48"/>
  </g>
  <text class="head" x="130" y="60" text-anchor="middle">用户</text>
  <text class="head" x="520" y="60" text-anchor="middle">前端页面（Vue）</text>
  <text class="head" x="910" y="60" text-anchor="middle">订单控制器（Express）</text>
  <text class="head" x="1300" y="60" text-anchor="middle">MySQL</text>

  <!-- 生命线（虚线） -->
  <g stroke="#404040" stroke-width="1.2" stroke-dasharray="6 5">
    <line x1="130" y1="90" x2="130" y2="1080"/>
    <line x1="520" y1="90" x2="520" y2="1080"/>
    <line x1="910" y1="90" x2="910" y2="1080"/>
    <line x1="1300" y1="90" x2="1300" y2="1080"/>
  </g>

  <!-- 激活条 -->
  <g fill="#E8E2DB" stroke="#404040" stroke-width="1">
    <rect x="124" y="138" width="12" height="662"/>
    <rect x="124" y="1004" width="12" height="22"/>
    <rect x="514" y="138" width="12" height="662"/>
    <rect x="514" y="944" width="12" height="82"/>
    <rect x="904" y="198" width="12" height="762"/>
    <rect x="1294" y="258" width="12" height="132"/>
    <rect x="1294" y="488" width="12" height="192"/>
    <rect x="1294" y="888" width="12" height="14"/>
  </g>

  <!-- 消息 -->
  <g stroke="#404040" stroke-width="1.4" fill="none">
    <line x1="130" y1="140" x2="519" y2="140" marker-end="url(#arr)"/>
    <line x1="520" y1="200" x2="909" y2="200" marker-end="url(#arr)"/>
    <line x1="910" y1="260" x2="1299" y2="260" marker-end="url(#arr)"/>
    <line x1="910" y1="320" x2="1299" y2="320" marker-end="url(#arr)"/>
    <line x1="1300" y1="380" x2="911" y2="380" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
  </g>
  <text class="msg" x="240" y="130">1.提交订单请求（携带收货信息）</text>
  <text class="msg" x="620" y="190">2.POST /api/orders（携带JWT令牌）</text>
  <text class="msg" x="1020" y="250">3.开启事务（BEGIN）</text>
  <text class="msg" x="1020" y="310">4.查询商品库存</text>
  <text class="msg" x="1020" y="370">5.返回库存结果</text>

  <!-- alt 组合框 -->
  <rect x="70" y="430" width="1460" height="630" fill="#FDFCFB" stroke="#404040" stroke-width="1.2"/>
  <path d="M70,430 L130,430 L130,462 L70,462 z" fill="#F3EFEA" stroke="#404040" stroke-width="1.2"/>
  <text class="frame" x="100" y="452">alt</text>
  <text class="msg" x="140" y="452">[库存判断]</text>
  <line x1="70" y1="840" x2="1530" y2="840" stroke="#404040" stroke-width="1.2" stroke-dasharray="6 4"/>

  <g stroke="#404040" stroke-width="1.4" fill="none">
    <line x1="910" y1="490" x2="1299" y2="490" marker-end="url(#arr)"/>
    <line x1="910" y1="550" x2="1299" y2="550" marker-end="url(#arr)"/>
    <line x1="910" y1="610" x2="1299" y2="610" marker-end="url(#arr)"/>
    <line x1="910" y1="670" x2="1299" y2="670" marker-end="url(#arr)"/>
    <line x1="910" y1="730" x2="521" y2="730" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
    <line x1="520" y1="790" x2="131" y2="790" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
    <line x1="910" y1="890" x2="1299" y2="890" marker-end="url(#arr)"/>
    <line x1="910" y1="950" x2="521" y2="950" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
    <line x1="520" y1="1010" x2="131" y2="1010" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
  </g>
  <text class="msg" x="1020" y="480">6.插入订单主表</text>
  <text class="msg" x="1020" y="540">7.插入订单项</text>
  <text class="msg" x="1020" y="600">8.扣减商品库存</text>
  <text class="msg" x="1020" y="660">9.提交事务（COMMIT）</text>
  <text class="msg" x="620" y="720">10.返回订单编号与成功状态</text>
  <text class="msg" x="240" y="780">11.展示下单成功页面</text>
  <text class="msg" x="1020" y="880">12.回滚事务（ROLLBACK）</text>
  <text class="msg" x="620" y="940">13.返回库存不足提示</text>
  <text class="msg" x="240" y="1000">14.展示错误提示</text>

  <text class="msg" x="150" y="862" fill="#666666">[库存充足]</text>
  <text class="msg" x="150" y="922" fill="#666666">[库存不足]</text>
</svg>
