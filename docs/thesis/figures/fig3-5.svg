<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#ffffff" stroke="#404040" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .act { font-size: 17px; }
    .guard { font-size: 16px; fill: #8C5230; font-weight: bold; }
    .note { font-size: 15px; fill: #666666; }
  </style>
  <rect x="0" y="0" width="1200" height="1460" fill="#ffffff"/>

  <!-- 开始 -->
  <circle cx="600" cy="50" r="11" fill="#404040"/>

  <!-- 活动节点 -->
  <g stroke="#404040" stroke-width="1.5" fill="#ffffff">
    <rect x="420" y="122" width="360" height="56" rx="8"/>
    <rect x="420" y="234" width="360" height="56" rx="8"/>
    <rect x="420" y="346" width="360" height="56" rx="8"/>
    <rect x="420" y="458" width="360" height="56" rx="8"/>
    <rect x="420" y="570" width="360" height="56" rx="8"/>
    <rect x="390" y="904" width="420" height="56" rx="8"/>
    <rect x="420" y="1040" width="360" height="56" rx="8"/>
    <rect x="420" y="1152" width="360" height="56" rx="8"/>
    <rect x="420" y="1264" width="360" height="56" rx="8"/>
    <rect x="760" y="714" width="340" height="56" rx="8"/>
  </g>
  <text class="act" x="600" y="156" text-anchor="middle">浏览或搜索商品</text>
  <text class="act" x="600" y="268" text-anchor="middle">查看商品详情</text>
  <text class="act" x="600" y="380" text-anchor="middle">加入购物车</text>
  <text class="act" x="600" y="492" text-anchor="middle">提交订单</text>
  <text class="act" x="600" y="604" text-anchor="middle">填写收货信息</text>
  <text class="act" x="600" y="938" text-anchor="middle">创建订单并扣减库存（事务）</text>
  <text class="act" x="600" y="1074" text-anchor="middle">订单状态：待付款</text>
  <text class="act" x="600" y="1186" text-anchor="middle">模拟支付</text>
  <text class="act" x="600" y="1298" text-anchor="middle">订单状态：已付款</text>
  <text class="act" x="930" y="748" text-anchor="middle">提示库存不足并返回</text>

  <!-- 判断节点：系统校验库存 -->
  <polygon points="600,678 740,742 600,806 460,742" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
  <text class="act" x="600" y="748" text-anchor="middle">系统校验库存</text>

  <!-- 流程线 -->
  <g stroke="#404040" stroke-width="1.5" fill="none">
    <line x1="600" y1="61" x2="600" y2="121" marker-end="url(#arr)"/>
    <line x1="600" y1="178" x2="600" y2="233" marker-end="url(#arr)"/>
    <line x1="600" y1="290" x2="600" y2="345" marker-end="url(#arr)"/>
    <line x1="600" y1="402" x2="600" y2="457" marker-end="url(#arr)"/>
    <line x1="600" y1="514" x2="600" y2="569" marker-end="url(#arr)"/>
    <line x1="600" y1="626" x2="600" y2="677" marker-end="url(#arr)"/>
    <line x1="600" y1="807" x2="600" y2="903" marker-end="url(#arr)"/>
    <line x1="600" y1="960" x2="600" y2="1039" marker-end="url(#arr)"/>
    <line x1="600" y1="1096" x2="600" y2="1151" marker-end="url(#arr)"/>
    <line x1="600" y1="1208" x2="600" y2="1263" marker-end="url(#arr)"/>
    <line x1="600" y1="1320" x2="600" y2="1384" marker-end="url(#arr)"/>
    <line x1="740" y1="742" x2="759" y2="742" marker-end="url(#arr)"/>
    <line x1="930" y1="770" x2="930" y2="1384" marker-end="url(#arr)"/>
  </g>
  <text class="guard" x="782" y="726">[库存不足]</text>
  <text class="guard" x="612" y="796">[库存充足]</text>

  <!-- 事务注释 -->
  <text class="note" x="930" y="932">注：订单创建、订单项生成与</text>
  <text class="note" x="930" y="954">库存扣减在同一数据库事务中</text>
  <text class="note" x="930" y="976">完成，任一步失败整体回滚。</text>

  <!-- 结束节点（主流程） -->
  <circle cx="600" cy="1400" r="16" fill="none" stroke="#404040" stroke-width="1.5"/>
  <circle cx="600" cy="1400" r="6" fill="#404040"/>

  <!-- 结束节点（库存不足分支） -->
  <circle cx="930" cy="1400" r="16" fill="none" stroke="#404040" stroke-width="1.5"/>
  <circle cx="930" cy="1400" r="6" fill="#404040"/>
</svg>
