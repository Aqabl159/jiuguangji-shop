<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1150" viewBox="0 0 1900 1150">
  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M14,1 L0,7 L14,13" fill="none" stroke="#404040" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .tab { font-size: 16px; font-weight: bold; }
    .fld { font-size: 15px; }
    .pk { font-size: 15px; font-weight: bold; }
    .one { font-size: 15px; fill: #8C5230; font-weight: bold; }
    .note { font-size: 15px; fill: #666666; }
  </style>
  <rect x="0" y="0" width="1900" height="1150" fill="#ffffff"/>

  <!-- ================= 表头 ================= -->
  <g fill="#EFECE8" stroke="#404040" stroke-width="1.2">
    <rect x="60" y="60" width="240" height="30"/>
    <rect x="60" y="400" width="240" height="30"/>
    <rect x="60" y="700" width="280" height="30"/>
    <rect x="700" y="60" width="250" height="30"/>
    <rect x="1040" y="60" width="260" height="30"/>
    <rect x="620" y="520" width="300" height="30"/>
    <rect x="1100" y="520" width="240" height="30"/>
    <rect x="1460" y="520" width="260" height="30"/>
    <rect x="300" y="900" width="240" height="30"/>
    <rect x="620" y="900" width="280" height="30"/>
  </g>
  <text class="tab" x="180" y="80" text-anchor="middle">user（用户表）</text>
  <text class="tab" x="180" y="420" text-anchor="middle">cart（购物车表）</text>
  <text class="tab" x="200" y="720" text-anchor="middle">review（评价表）</text>
  <text class="tab" x="825" y="80" text-anchor="middle">order（订单主表）</text>
  <text class="tab" x="1170" y="80" text-anchor="middle">order_item（订单项表）</text>
  <text class="tab" x="770" y="540" text-anchor="middle">product（商品主表）</text>
  <text class="tab" x="1220" y="540" text-anchor="middle">product_image（商品图表）</text>
  <text class="tab" x="1590" y="540" text-anchor="middle">inspection_item（检测项表）</text>
  <text class="tab" x="420" y="920" text-anchor="middle">category（分类表）</text>
  <text class="tab" x="760" y="920" text-anchor="middle">condition_grade（成色等级字典表）</text>

  <!-- ================= 表框 ================= -->
  <g stroke="#404040" stroke-width="1.2" fill="none">
    <rect x="60" y="60" width="240" height="150"/>
    <rect x="60" y="400" width="240" height="126"/>
    <rect x="60" y="700" width="280" height="174"/>
    <rect x="700" y="60" width="250" height="150"/>
    <rect x="1040" y="60" width="260" height="150"/>
    <rect x="620" y="520" width="300" height="222"/>
    <rect x="1100" y="520" width="240" height="126"/>
    <rect x="1460" y="520" width="260" height="126"/>
    <rect x="300" y="900" width="240" height="102"/>
    <rect x="620" y="900" width="280" height="150"/>
  </g>
  <!-- 行分隔线 -->
  <g stroke="#404040" stroke-width="0.8">
    <line x1="60" y1="114" x2="300" y2="114"/><line x1="60" y1="138" x2="300" y2="138"/>
    <line x1="60" y1="162" x2="300" y2="162"/><line x1="60" y1="186" x2="300" y2="186"/>
    <line x1="60" y1="454" x2="300" y2="454"/><line x1="60" y1="478" x2="300" y2="478"/>
    <line x1="60" y1="502" x2="300" y2="502"/>
    <line x1="60" y1="754" x2="340" y2="754"/><line x1="60" y1="778" x2="340" y2="778"/>
    <line x1="60" y1="802" x2="340" y2="802"/><line x1="60" y1="826" x2="340" y2="826"/>
    <line x1="60" y1="850" x2="340" y2="850"/>
    <line x1="700" y1="114" x2="950" y2="114"/><line x1="700" y1="138" x2="950" y2="138"/>
    <line x1="700" y1="162" x2="950" y2="162"/><line x1="700" y1="186" x2="950" y2="186"/>
    <line x1="1040" y1="114" x2="1300" y2="114"/><line x1="1040" y1="138" x2="1300" y2="138"/>
    <line x1="1040" y1="162" x2="1300" y2="162"/><line x1="1040" y1="186" x2="1300" y2="186"/>
    <line x1="620" y1="574" x2="920" y2="574"/><line x1="620" y1="598" x2="920" y2="598"/>
    <line x1="620" y1="622" x2="920" y2="622"/><line x1="620" y1="646" x2="920" y2="646"/>
    <line x1="620" y1="670" x2="920" y2="670"/><line x1="620" y1="694" x2="920" y2="694"/>
    <line x1="620" y1="718" x2="920" y2="718"/>
    <line x1="1100" y1="574" x2="1340" y2="574"/><line x1="1100" y1="598" x2="1340" y2="598"/>
    <line x1="1100" y1="622" x2="1340" y2="622"/>
    <line x1="1460" y1="574" x2="1720" y2="574"/><line x1="1460" y1="598" x2="1720" y2="598"/>
    <line x1="1460" y1="622" x2="1720" y2="622"/>
    <line x1="300" y1="954" x2="540" y2="954"/><line x1="300" y1="978" x2="540" y2="978"/>
    <line x1="620" y1="954" x2="900" y2="954"/><line x1="620" y1="978" x2="900" y2="978"/>
    <line x1="620" y1="1002" x2="900" y2="1002"/><line x1="620" y1="1026" x2="900" y2="1026"/>
  </g>

  <!-- ================= 字段 ================= -->
  <text class="pk" x="74" y="109">user_id (PK)</text>
  <text class="fld" x="74" y="133">username</text>
  <text class="fld" x="74" y="157">password_hash</text>
  <text class="fld" x="74" y="181">role</text>
  <text class="fld" x="74" y="205">status</text>

  <text class="pk" x="74" y="449">cart_id (PK)</text>
  <text class="fld" x="74" y="473">user_id (FK)</text>
  <text class="fld" x="74" y="497">product_id (FK)</text>
  <text class="fld" x="74" y="521">quantity</text>

  <text class="pk" x="74" y="749">review_id (PK)</text>
  <text class="fld" x="74" y="773">product_id (FK)</text>
  <text class="fld" x="74" y="797">user_id (FK)</text>
  <text class="fld" x="74" y="821">order_id (FK)</text>
  <text class="fld" x="74" y="845">rating</text>
  <text class="fld" x="74" y="869">content</text>

  <text class="pk" x="714" y="109">order_id (PK)</text>
  <text class="fld" x="714" y="133">order_no</text>
  <text class="fld" x="714" y="157">user_id (FK)</text>
  <text class="fld" x="714" y="181">total_amount</text>
  <text class="fld" x="714" y="205">status</text>

  <text class="pk" x="1054" y="109">item_id (PK)</text>
  <text class="fld" x="1054" y="133">order_id (FK)</text>
  <text class="fld" x="1054" y="157">product_id (FK)</text>
  <text class="fld" x="1054" y="181">price</text>
  <text class="fld" x="1054" y="205">quantity</text>

  <text class="pk" x="634" y="569">product_id (PK)</text>
  <text class="fld" x="634" y="593">category_id (FK)</text>
  <text class="fld" x="634" y="617">product_type</text>
  <text class="fld" x="634" y="641">title</text>
  <text class="fld" x="634" y="665">price</text>
  <text class="fld" x="634" y="689">stock</text>
  <text class="fld" x="634" y="713">status</text>
  <text class="fld" x="634" y="737">condition_grade_code (FK)</text>

  <text class="pk" x="1114" y="569">image_id (PK)</text>
  <text class="fld" x="1114" y="593">product_id (FK)</text>
  <text class="fld" x="1114" y="617">url</text>
  <text class="fld" x="1114" y="641">sort</text>

  <text class="pk" x="1474" y="569">item_id (PK)</text>
  <text class="fld" x="1474" y="593">product_id (FK)</text>
  <text class="fld" x="1474" y="617">item_name</text>
  <text class="fld" x="1474" y="641">result</text>

  <text class="pk" x="314" y="949">category_id (PK)</text>
  <text class="fld" x="314" y="973">name</text>
  <text class="fld" x="314" y="997">parent_id</text>

  <text class="pk" x="634" y="949">grade_code (PK)</text>
  <text class="fld" x="634" y="973">grade_name</text>
  <text class="fld" x="634" y="997">appearance_desc</text>
  <text class="fld" x="634" y="1021">function_desc</text>
  <text class="fld" x="634" y="1045">accessory_desc</text>

  <!-- ================= 外键连线 ================= -->
  <g stroke="#404040" stroke-width="1.2" fill="none">
    <!-- L1 user.user_id → cart.user_id（左总线） -->
    <path d="M60,102 L30,102 L30,466 L60,466" marker-end="url(#crow)"/>
    <!-- L2 user.user_id → review.user_id（续总线） -->
    <path d="M30,466 L30,790 L60,790" marker-end="url(#crow)"/>
    <!-- L3 user.user_id → order.user_id -->
    <path d="M300,102 L302,102 L302,150 L700,150" marker-end="url(#crow)"/>
    <!-- L4 order.order_id → order_item.order_id -->
    <line x1="950" y1="102" x2="1040" y2="102" marker-end="url(#crow)"/>
    <!-- L5 order.order_id → review.order_id -->
    <path d="M800,210 L800,240 L40,240 L40,814 L60,814" marker-end="url(#crow)"/>
    <!-- L6 order_item.product_id → product.product_id -->
    <path d="M1050,210 L1050,470 L920,470 L920,562" marker-end="url(#crow)"/>
    <!-- L7 category.category_id → product.category_id -->
    <line x1="420" y1="900" x2="620" y2="730" marker-end="url(#crow)"/>
    <!-- L8 condition_grade.grade_code → product.condition_grade_code -->
    <line x1="760" y1="900" x2="760" y2="730" marker-end="url(#crow)"/>
    <!-- L9 product.product_id → product_image.product_id -->
    <path d="M920,706 L940,706 L940,560 L1100,560 L1100,586" marker-end="url(#crow)"/>
    <!-- L10 product.product_id → inspection_item.product_id -->
    <path d="M930,742 L930,1120 L1460,1120 L1460,586" marker-end="url(#crow)"/>
    <!-- L11 product.product_id → cart.product_id -->
    <path d="M620,562 L302,562 L302,490" marker-end="url(#crow)"/>
    <!-- L12 product.product_id → review.product_id -->
    <path d="M910,742 L910,1070 L48,1070 L48,766 L59,766" marker-end="url(#crow)"/>
  </g>

  <!-- “1” 标注（主键侧） -->
  <text class="one" x="44" y="96">1</text>
  <text class="one" x="312" y="94">1</text>
  <text class="one" x="962" y="94">1</text>
  <text class="one" x="792" y="230">1</text>
  <text class="one" x="1062" y="230">1</text>
  <text class="one" x="432" y="914">1</text>
  <text class="one" x="772" y="914">1</text>
  <text class="one" x="912" y="698">1</text>
  <text class="one" x="942" y="762">1</text>
  <text class="one" x="612" y="556">1</text>
  <text class="one" x="898" y="762">1</text>

  <text class="note" x="1000" y="1090">注：连线分叉端为外键所在表（"n"侧），标注"1"的一端为主键侧。</text>
</svg>
