<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#ffffff" stroke="#404040" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .act { font-size: 17px; }
    .guard { font-size: 16px; fill: #8C5230; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="1200" height="1380" fill="#ffffff"/>

  <!-- 开始 -->
  <circle cx="600" cy="45" r="11" fill="#404040"/>

  <!-- 活动节点 -->
  <g stroke="#404040" stroke-width="1.5" fill="#ffffff">
    <rect x="420" y="107" width="360" height="56" rx="8"/>
    <rect x="420" y="219" width="360" height="56" rx="8"/>
    <rect x="420" y="331" width="360" height="56" rx="8"/>
    <rect x="420" y="692" width="360" height="56" rx="8"/>
    <rect x="420" y="804" width="360" height="56" rx="8"/>
    <rect x="420" y="1060" width="360" height="56" rx="8"/>
    <rect x="420" y="1172" width="360" height="56" rx="8"/>
    <rect x="790" y="492" width="340" height="56" rx="8"/>
  </g>
  <text class="act" x="600" y="141" text-anchor="middle">登录后台</text>
  <text class="act" x="600" y="253" text-anchor="middle">查看订单列表</text>
  <text class="act" x="600" y="365" text-anchor="middle">按状态筛选订单</text>
  <text class="act" x="600" y="726" text-anchor="middle">执行发货操作</text>
  <text class="act" x="600" y="838" text-anchor="middle">订单状态推进为"已发货"</text>
  <text class="act" x="600" y="1094" text-anchor="middle">确认收货并完成订单</text>
  <text class="act" x="600" y="1206" text-anchor="middle">订单状态推进为"已完成"</text>
  <text class="act" x="960" y="526" text-anchor="middle">等待用户支付或取消</text>

  <!-- 判断节点：订单状态判断 -->
  <polygon points="600,445 750,520 600,595 450,520" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
  <text class="act" x="600" y="526" text-anchor="middle">订单状态判断</text>

  <!-- 合并节点 -->
  <polygon points="600,921 710,976 600,1031 490,976" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>

  <!-- 流程线 -->
  <g stroke="#404040" stroke-width="1.5" fill="none">
    <line x1="600" y1="56" x2="600" y2="106" marker-end="url(#arr)"/>
    <line x1="600" y1="163" x2="600" y2="218" marker-end="url(#arr)"/>
    <line x1="600" y1="275" x2="600" y2="330" marker-end="url(#arr)"/>
    <line x1="600" y1="387" x2="600" y2="444" marker-end="url(#arr)"/>
    <line x1="600" y1="596" x2="600" y2="691" marker-end="url(#arr)"/>
    <line x1="600" y1="748" x2="600" y2="803" marker-end="url(#arr)"/>
    <line x1="600" y1="860" x2="600" y2="920" marker-end="url(#arr)"/>
    <line x1="600" y1="1032" x2="600" y2="1059" marker-end="url(#arr)"/>
    <line x1="600" y1="1116" x2="600" y2="1171" marker-end="url(#arr)"/>
    <line x1="600" y1="1228" x2="600" y2="1294" marker-end="url(#arr)"/>
    <line x1="750" y1="520" x2="789" y2="520" marker-end="url(#arr)"/>
    <line x1="960" y1="548" x2="960" y2="1294" marker-end="url(#arr)"/>
    <path d="M450,520 L280,520 L280,976 L489,976" marker-end="url(#arr)"/>
  </g>
  <text class="guard" x="792" y="504">[待付款]</text>
  <text class="guard" x="612" y="566">[已付款]</text>
  <text class="guard" x="350" y="504">[已发货]</text>

  <!-- 结束节点（主流程） -->
  <circle cx="600" cy="1310" r="16" fill="none" stroke="#404040" stroke-width="1.5"/>
  <circle cx="600" cy="1310" r="6" fill="#404040"/>

  <!-- 结束节点（待付款分支） -->
  <circle cx="960" cy="1310" r="16" fill="none" stroke="#404040" stroke-width="1.5"/>
  <circle cx="960" cy="1310" r="6" fill="#404040"/>
</svg>
