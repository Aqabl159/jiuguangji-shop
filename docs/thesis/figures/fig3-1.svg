<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .head { font-size: 21px; font-weight: bold; fill: #262626; }
    .lab { font-size: 16px; fill: #333333; }
    .val { font-size: 16px; fill: #262626; font-weight: bold; }
    .axis { font-size: 14px; fill: #666666; }
  </style>
  <rect x="0" y="0" width="1500" height="800" fill="#ffffff"/>

  <text class="head" x="350" y="52" text-anchor="middle">（a）年龄分布</text>
  <text class="head" x="850" y="52" text-anchor="middle">（b）身份构成</text>
  <text class="head" x="1350" y="52" text-anchor="middle">（c）胶片相机持有情况</text>

  <line x1="700" y1="66" x2="700" y2="770" stroke="#D8D4CE" stroke-width="1"/>
  <line x1="1200" y1="66" x2="1200" y2="770" stroke="#D8D4CE" stroke-width="1"/>

  <!-- ============ 面板 (a)：条形起点 x=260，满值宽 220 ============ -->
  <line x1="260" y1="730" x2="480" y2="730" stroke="#404040" stroke-width="1.2"/>
  <text class="axis" x="260" y="752">0</text>
  <text class="axis" x="480" y="752" text-anchor="end">100%</text>
  <rect x="260" y="99" width="101.2" height="42" fill="#8C5230"/>
  <text class="lab" x="240" y="126" text-anchor="end">18~25岁</text>
  <text class="val" x="375" y="126">46%</text>
  <rect x="260" y="229" width="68.2" height="42" fill="#A97456"/>
  <text class="lab" x="240" y="256" text-anchor="end">26~35岁</text>
  <text class="val" x="342" y="256">31%</text>
  <rect x="260" y="359" width="50.6" height="42" fill="#C89A7E"/>
  <text class="lab" x="240" y="386" text-anchor="end">36岁及以上</text>
  <text class="val" x="324" y="386">23%</text>

  <!-- ============ 面板 (b) ============ -->
  <line x1="760" y1="730" x2="980" y2="730" stroke="#404040" stroke-width="1.2"/>
  <text class="axis" x="760" y="752">0</text>
  <text class="axis" x="980" y="752" text-anchor="end">100%</text>
  <rect x="760" y="99" width="83.6" height="42" fill="#8C5230"/>
  <text class="lab" x="740" y="126" text-anchor="end">在校学生</text>
  <text class="val" x="858" y="126">38%</text>
  <rect x="760" y="229" width="90.2" height="42" fill="#A97456"/>
  <text class="lab" x="740" y="256" text-anchor="end">职场人士</text>
  <text class="val" x="864" y="256">41%</text>
  <rect x="760" y="359" width="46.2" height="42" fill="#C89A7E"/>
  <text class="lab" x="740" y="386" text-anchor="end">自由职业及其他</text>
  <text class="val" x="820" y="386">21%</text>

  <!-- ============ 面板 (c) ============ -->
  <line x1="1260" y1="730" x2="1480" y2="730" stroke="#404040" stroke-width="1.2"/>
  <text class="axis" x="1260" y="752">0</text>
  <text class="axis" x="1480" y="752" text-anchor="end">100%</text>
  <rect x="1260" y="99" width="118.8" height="42" fill="#8C5230"/>
  <text class="lab" x="1240" y="126" text-anchor="end">拥有且经常使用</text>
  <text class="val" x="1392" y="126">54%</text>
  <rect x="1260" y="229" width="39.6" height="42" fill="#A97456"/>
  <text class="lab" x="1240" y="256" text-anchor="end">拥有但偶尔使用</text>
  <text class="val" x="1314" y="256">18%</text>
  <rect x="1260" y="359" width="61.6" height="42" fill="#C89A7E"/>
  <text class="lab" x="1240" y="386" text-anchor="end">尚未购入（有购买意愿）</text>
  <text class="val" x="1336" y="386">28%</text>
</svg>
