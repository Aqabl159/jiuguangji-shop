<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <defs>
    <marker id="arrOpen" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#ffffff" stroke="#8C5230" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SimSun','宋体',serif; }
    .uc { font-size: 17px; fill: #262626; }
    .actor { font-size: 18px; fill: #262626; font-weight: bold; }
    .boundary { font-size: 18px; fill: #8C5230; font-weight: bold; }
    .inc { font-size: 14px; fill: #8C5230; }
  </style>
  <rect x="0" y="0" width="1500" height="950" fill="#ffffff"/>

  <!-- 系统边界 -->
  <rect x="420" y="40" width="1030" height="870" fill="none" stroke="#8C5230" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text class="boundary" x="438" y="72">旧光集影像器材电商网站（后台）</text>

  <!-- 参与者：管理员 -->
  <circle cx="150" cy="388" r="16" fill="none" stroke="#404040" stroke-width="2"/>
  <line x1="150" y1="404" x2="150" y2="452" stroke="#404040" stroke-width="2"/>
  <line x1="128" y1="422" x2="172" y2="422" stroke="#404040" stroke-width="2"/>
  <line x1="150" y1="452" x2="134" y2="480" stroke="#404040" stroke-width="2"/>
  <line x1="150" y1="452" x2="166" y2="480" stroke="#404040" stroke-width="2"/>
  <text class="actor" x="150" y="512" text-anchor="middle">管理员</text>

  <!-- 左列用例 -->
  <g>
    <ellipse cx="620" cy="140" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="620" y="146" text-anchor="middle">登录</text>
    <ellipse cx="620" cy="300" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="620" y="306" text-anchor="middle">分类管理</text>
    <ellipse cx="620" cy="460" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="620" y="466" text-anchor="middle">商品管理</text>
    <ellipse cx="620" cy="620" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="620" y="626" text-anchor="middle">订单管理</text>
    <ellipse cx="620" cy="780" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="620" y="786" text-anchor="middle">用户管理</text>
  </g>

  <!-- 右列用例 -->
  <g>
    <ellipse cx="1150" cy="110" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="1150" y="116" text-anchor="middle">维护垂直属性</text>
    <ellipse cx="1150" cy="245" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="1150" y="251" text-anchor="middle">上传商品图片</text>
    <ellipse cx="1150" cy="380" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="1150" y="386" text-anchor="middle">维护检测项清单</text>
    <ellipse cx="1150" cy="515" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="1150" y="521" text-anchor="middle">商品上下架</text>
    <ellipse cx="1150" cy="650" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="1150" y="656" text-anchor="middle">订单发货</text>
    <ellipse cx="1150" cy="785" rx="120" ry="36" fill="#ffffff" stroke="#404040" stroke-width="1.5"/>
    <text class="uc" x="1150" y="791" text-anchor="middle">禁用与启用账号</text>
  </g>

  <!-- 参与者关联线 -->
  <line x1="180" y1="440" x2="500" y2="140" stroke="#404040" stroke-width="1.5"/>
  <line x1="180" y1="440" x2="500" y2="300" stroke="#404040" stroke-width="1.5"/>
  <line x1="180" y1="440" x2="500" y2="460" stroke="#404040" stroke-width="1.5"/>
  <line x1="180" y1="440" x2="500" y2="620" stroke="#404040" stroke-width="1.5"/>
  <line x1="180" y1="440" x2="500" y2="780" stroke="#404040" stroke-width="1.5"/>

  <!-- 商品管理 include 四个右列用例（自上边缘引出，经 x=800 总线） -->
  <g stroke="#8C5230" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <path d="M620,422 L800,422 L800,110 L1028,110" marker-end="url(#arrOpen)"/>
    <path d="M620,422 L800,422 L800,245 L1028,245" marker-end="url(#arrOpen)"/>
    <path d="M620,422 L800,422 L800,380 L1028,380" marker-end="url(#arrOpen)"/>
    <path d="M620,422 L800,422 L800,515 L1028,515" marker-end="url(#arrOpen)"/>
  </g>
  <text class="inc" x="626" y="414">«include»</text>
  <text class="inc" x="806" y="180">«include»</text>
  <text class="inc" x="806" y="315">«include»</text>
  <text class="inc" x="806" y="490">«include»</text>

  <!-- 订单管理 include 订单发货 -->
  <g stroke="#8C5230" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <path d="M742,620 L800,620 L800,650 L1028,650" marker-end="url(#arrOpen)"/>
  </g>
  <text class="inc" x="746" y="612">«include»</text>

  <!-- 用户管理 include 禁用与启用账号 -->
  <g stroke="#8C5230" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <path d="M742,780 L800,780 L800,785 L1028,785" marker-end="url(#arrOpen)"/>
  </g>
  <text class="inc" x="746" y="772">«include»</text>
</svg>
