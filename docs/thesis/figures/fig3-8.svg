<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#404040"/>
    </marker>
    <marker id="arrOpen" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#ffffff" stroke="#404040" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SimSun','宋体',serif; fill: #262626; }
    .head { font-size: 16px; font-weight: bold; }
    .msg { font-size: 15px; }
    .frame { font-size: 16px; fill: #8C5230; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="1600" height="1080" fill="#ffffff"/>

  <!-- 生命线头部 -->
  <g stroke="#404040" stroke-width="1.5" fill="#ffffff">
    <rect x="30" y="30" width="200" height="48"/>
    <rect x="420" y="30" width="200" height="48"/>
    <rect x="810" y="30" width="200" height="48"/>
    <rect x="1200" y="30" width="200" height="48"/>
  </g>
  <text class="head" x="130" y="60" text-anchor="middle">管理员</text>
  <text class="head" x="520" y="60" text-anchor="middle">后台前端页面（Vue）</text>
  <text class="head" x="910" y="60" text-anchor="middle">鉴权控制器与中间件（Express）</text>
  <text class="head" x="1300" y="60" text-anchor="middle">MySQL</text>

  <!-- 生命线（虚线） -->
  <g stroke="#404040" stroke-width="1.2" stroke-dasharray="6 5">
    <line x1="130" y1="90" x2="130" y2="1060"/>
    <line x1="520" y1="90" x2="520" y2="1060"/>
    <line x1="910" y1="90" x2="910" y2="1060"/>
    <line x1="1300" y1="90" x2="1300" y2="1060"/>
  </g>

  <!-- 激活条 -->
  <g fill="#E8E2DB" stroke="#404040" stroke-width="1">
    <rect x="124" y="138" width="12" height="542"/>
    <rect x="514" y="138" width="12" height="622"/>
    <rect x="904" y="198" width="12" height="352"/>
    <rect x="904" y="788" width="12" height="192"/>
    <rect x="1294" y="258" width="12" height="72"/>
  </g>

  <!-- 消息 -->
  <g stroke="#404040" stroke-width="1.4" fill="none">
    <line x1="130" y1="140" x2="519" y2="140" marker-end="url(#arr)"/>
    <line x1="520" y1="200" x2="909" y2="200" marker-end="url(#arr)"/>
    <line x1="910" y1="260" x2="1299" y2="260" marker-end="url(#arr)"/>
    <line x1="1300" y1="320" x2="911" y2="320" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
    <line x1="910" y1="530" x2="521" y2="530" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
    <line x1="130" y1="670" x2="519" y2="670" marker-end="url(#arr)"/>
    <line x1="520" y1="730" x2="909" y2="730" marker-end="url(#arr)"/>
  </g>
  <text class="msg" x="240" y="130">1.输入账号与密码</text>
  <text class="msg" x="620" y="190">2.POST /api/auth/login</text>
  <text class="msg" x="1020" y="250">3.查询用户记录</text>
  <text class="msg" x="1020" y="310">4.返回用户信息（含密码哈希与角色）</text>
  <text class="msg" x="620" y="520">7.签发并返回JWT令牌</text>
  <text class="msg" x="240" y="660">9.携带令牌访问后台接口</text>
  <text class="msg" x="620" y="720">10.请求经鉴权中间件校验</text>

  <!-- 自调用消息 -->
  <g stroke="#404040" stroke-width="1.4" fill="none">
    <path d="M916,380 L958,380 L958,412 L918,412" marker-end="url(#arr)"/>
    <path d="M916,452 L958,452 L958,484 L918,484" marker-end="url(#arr)"/>
    <path d="M526,592 L568,592 L568,624 L528,624" marker-end="url(#arr)"/>
    <path d="M916,792 L958,792 L958,824 L918,824" marker-end="url(#arr)"/>
  </g>
  <text class="msg" x="968" y="402">5.使用bcrypt比对密码</text>
  <text class="msg" x="968" y="474">6.校验角色为admin</text>
  <text class="msg" x="578" y="614">8.令牌存入localStorage</text>
  <text class="msg" x="968" y="814">11.校验令牌签名与角色</text>

  <!-- alt 组合框 -->
  <rect x="70" y="850" width="1460" height="190" fill="#FDFCFB" stroke="#404040" stroke-width="1.2"/>
  <path d="M70,850 L130,850 L130,882 L70,882 z" fill="#F3EFEA" stroke="#404040" stroke-width="1.2"/>
  <text class="frame" x="100" y="872">alt</text>
  <text class="msg" x="140" y="872">[校验结果]</text>
  <line x1="70" y1="935" x2="1530" y2="935" stroke="#404040" stroke-width="1.2" stroke-dasharray="6 4"/>

  <g stroke="#404040" stroke-width="1.4" fill="none">
    <line x1="910" y1="900" x2="521" y2="900" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
    <line x1="910" y1="965" x2="521" y2="965" stroke-dasharray="5 4" marker-end="url(#arrOpen)"/>
  </g>
  <text class="msg" x="620" y="890">12.放行请求并返回业务数据</text>
  <text class="msg" x="620" y="955">13.返回403拒绝访问</text>

  <text class="msg" x="150" y="912" fill="#666666">[校验通过]</text>
  <text class="msg" x="150" y="977" fill="#666666">[校验失败]</text>
</svg>
