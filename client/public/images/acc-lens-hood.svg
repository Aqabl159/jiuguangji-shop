<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="带遮光罩的镜头剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 遮光罩（喇叭口） -->
  <path d="M160 104 L240 104 L266 150 L240 196 L160 196 L134 150 Z" fill="#1a130d" stroke="#8c4a2f" stroke-width="2.5"/>
  <path d="M168 112 L234 112 L256 150 L234 188 L168 188 L146 150 Z" fill="none" stroke="#b98a2f" stroke-width="1.5" opacity="0.6"/>
  <!-- 镜身（露出部分） -->
  <rect x="150" y="186" width="100" height="44" rx="6" fill="#2b2118"/>
  <g stroke="#8c4a2f" stroke-width="2" opacity="0.5">
    <line x1="158" y1="194" x2="158" y2="222"/><line x1="242" y1="194" x2="242" y2="222"/>
  </g>
  <!-- 镜片 -->
  <circle cx="200" cy="150" r="40" fill="#1a130d" stroke="#b98a2f" stroke-width="3"/>
  <circle cx="200" cy="150" r="26" fill="#0d0a07"/>
  <path d="M178 132 A30 30 0 0 1 208 122" fill="none" stroke="#b98a2f" stroke-width="3.5" opacity="0.5" stroke-linecap="round"/>
  <text x="200" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#2b2118">HOOD</text>
  <text x="200" y="240" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">CANON FD</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.15</text>
</svg>
