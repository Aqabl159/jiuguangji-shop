<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="镜头侧面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 镜身 -->
  <rect x="132" y="86" width="136" height="128" rx="10" fill="#2b2118"/>
  <!-- 对焦环纹理 -->
  <g stroke="#8c4a2f" stroke-width="2" opacity="0.5">
    <line x1="142" y1="96" x2="142" y2="204"/><line x1="258" y1="96" x2="258" y2="204"/>
    <line x1="148" y1="96" x2="148" y2="204"/><line x1="252" y1="96" x2="252" y2="204"/>
  </g>
  <!-- 前组镜片 -->
  <circle cx="200" cy="150" r="52" fill="#2b2118" stroke="#b98a2f" stroke-width="4"/>
  <circle cx="200" cy="150" r="40" fill="#1a130d" stroke="#8c4a2f" stroke-width="2"/>
  <circle cx="200" cy="150" r="27" fill="#0d0a07"/>
  <path d="M172 126 A38 38 0 0 1 210 114" fill="none" stroke="#b98a2f" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <path d="M166 168 A46 46 0 0 0 194 198" fill="none" stroke="#8c4a2f" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <!-- 光圈环刻度 -->
  <text x="200" y="66" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#2b2118">50mm f/1.4</text>
  <text x="200" y="222" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">CANON FD</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.14</text>
</svg>
