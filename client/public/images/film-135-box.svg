  <text x="200" y="199" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#e8d9a8">PORTRA</text>
  <text x="200" y="222" text-anchor="middle" font-family="Courier New, monospace" font-size="8" fill="#2b2118">35MM · 36 EXP</text>
