  <rect x="146" y="74" width="108" height="152" rx="2" fill="none" stroke="#2b2118" stroke-width="1.5"/>
  <text x="200" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#2b2118">KODAK</text>
  <text x="200" y="168" text-anchor="middle" font-family="Courier New, monospace" font-size="52" font-weight="bold" fill="#2b2118">400</text>
