<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="拍立得相机正面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 机身 -->
  <rect x="122" y="60" width="156" height="128" rx="12" fill="#2b2118"/>
  <!-- 面板 -->
  <rect x="136" y="74" width="128" height="100" rx="8" fill="#4a372a"/>
  <!-- 闪光窗 -->
  <rect x="148" y="86" width="30" height="22" rx="3" fill="#e8d9a8" opacity="0.85"/>
  <!-- 镜头 -->
  <circle cx="200" cy="124" r="24" fill="#2b2118" stroke="#b98a2f" stroke-width="3"/>
  <circle cx="200" cy="124" r="15" fill="#1a130d"/>
  <circle cx="200" cy="124" r="8" fill="#0d0a07"/>
  <path d="M190 114 A14 14 0 0 1 204 108" fill="none" stroke="#b98a2f" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <!-- 彩虹装饰条 -->
  <g>
    <rect x="150" y="118" width="4" height="16" fill="#8c4a2f"/><rect x="156" y="118" width="4" height="16" fill="#b98a2f"/>
    <rect x="162" y="118" width="4" height="16" fill="#4a6b3a"/>
  </g>
  <text x="200" y="84" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="2" fill="#b98a2f">SX-70</text>
  <!-- 出片口 -->
  <rect x="142" y="168" width="116" height="6" rx="2" fill="#1a130d"/>
  <text x="200" y="186" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">POLAROID</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.08</text>
</svg>
