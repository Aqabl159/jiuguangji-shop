<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="UV 滤镜剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 滤镜环 -->
  <circle cx="200" cy="150" r="78" fill="#2b2118"/>
  <circle cx="200" cy="150" r="66" fill="none" stroke="#8c4a2f" stroke-width="2"/>
  <!-- 螺口纹理 -->
  <circle cx="200" cy="150" r="72" fill="none" stroke="#b98a2f" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8"/>
  <!-- 玻璃 -->
  <circle cx="200" cy="150" r="56" fill="#b9c9cd" opacity="0.55"/>
  <circle cx="200" cy="150" r="56" fill="none" stroke="#2b2118" stroke-width="3"/>
  <!-- 玻璃高光 -->
  <path d="M162 116 A52 52 0 0 1 216 100" fill="none" stroke="#fbf5e9" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
  <path d="M150 176 A64 64 0 0 0 190 212" fill="none" stroke="#fbf5e9" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
  <!-- 刻字 -->
  <text x="200" y="62" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#2b2118">UV · 49mm</text>
  <text x="200" y="244" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">MULTI-COATED</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.18</text>
</svg>
