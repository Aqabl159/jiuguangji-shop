<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="闪光灯剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 灯头 -->
  <rect x="128" y="46" width="144" height="102" rx="8" fill="#2b2118"/>
  <!-- 反光碗 -->
  <rect x="138" y="56" width="124" height="82" fill="#e8d9a8" opacity="0.9"/>
  <g stroke="#b98a2f" stroke-width="1.5" opacity="0.8">
    <line x1="138" y1="70" x2="262" y2="70"/><line x1="138" y1="84" x2="262" y2="84"/>
    <line x1="138" y1="98" x2="262" y2="98"/><line x1="138" y1="112" x2="262" y2="112"/>
  </g>
  <!-- 灯管 -->
  <rect x="146" y="62" width="10" height="70" rx="5" fill="#fbf5e9" stroke="#9c8d78" stroke-width="1"/>
  <!-- 机身 -->
  <rect x="174" y="148" width="52" height="92" rx="8" fill="#2b2118"/>
  <rect x="182" y="160" width="36" height="12" rx="2" fill="#b98a2f"/>
  <rect x="182" y="180" width="36" height="12" rx="2" fill="#b98a2f"/>
  <!-- 热靴座 -->
  <rect x="168" y="240" width="64" height="14" rx="2" fill="#4a372a"/>
  <!-- 就绪指示灯 -->
  <circle cx="210" cy="228" r="4" fill="#a03030"/>
  <text x="200" y="32" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="2" fill="#2b2118">METZ 45</text>
  <text x="200" y="130" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">CL-4</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.16</text>
</svg>
