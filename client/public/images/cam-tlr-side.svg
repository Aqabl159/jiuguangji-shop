<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="双反相机侧面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 机身侧影 -->
  <rect x="150" y="80" width="100" height="144" rx="8" fill="#2b2118"/>
  <!-- 皮饰菱形纹理 -->
  <g stroke="#8c4a2f" stroke-width="1.5" opacity="0.45" fill="none">
    <rect x="162" y="96" width="22" height="22" transform="rotate(45 173 107)"/>
    <rect x="188" y="96" width="22" height="22" transform="rotate(45 199 107)"/>
    <rect x="162" y="130" width="22" height="22" transform="rotate(45 173 141)"/>
    <rect x="188" y="130" width="22" height="22" transform="rotate(45 199 141)"/>
    <rect x="162" y="164" width="22" height="22" transform="rotate(45 173 175)"/>
    <rect x="188" y="164" width="22" height="22" transform="rotate(45 199 175)"/>
  </g>
  <!-- 侧面调焦旋钮 -->
  <circle cx="200" cy="118" r="24" fill="#4a372a" stroke="#b98a2f" stroke-width="2.5"/>
  <circle cx="200" cy="118" r="13" fill="none" stroke="#b98a2f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <circle cx="200" cy="118" r="5" fill="#b98a2f"/>
  <!-- 铰链与卡扣 -->
  <rect x="142" y="180" width="8" height="30" rx="2" fill="#4a372a"/>
  <rect x="250" y="180" width="8" height="30" rx="2" fill="#4a372a"/>
  <text x="200" y="212" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">120 FILM</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.07</text>
</svg>
