<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="拍立得相机背面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 机身背面 -->
  <rect x="122" y="60" width="156" height="128" rx="12" fill="#2b2118"/>
  <rect x="136" y="74" width="128" height="100" rx="8" fill="none" stroke="#8c4a2f" stroke-width="1.5" opacity="0.7"/>
  <!-- 片仓门 -->
  <rect x="146" y="84" width="108" height="80" rx="4" fill="none" stroke="#b98a2f" stroke-width="2"/>
  <!-- 铰链与锁扣 -->
  <g fill="#4a372a">
    <rect x="140" y="92" width="8" height="64" rx="2"/>
    <rect x="252" y="92" width="8" height="64" rx="2"/>
    <rect x="188" y="164" width="24" height="6" rx="2"/>
  </g>
  <!-- 螺丝 -->
  <g fill="#8c4a2f">
    <circle cx="160" cy="98" r="3"/><circle cx="240" cy="98" r="3"/>
    <circle cx="160" cy="150" r="3"/><circle cx="240" cy="150" r="3"/>
  </g>
  <text x="200" y="176" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">SERIAL NO. 000001</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.09</text>
</svg>
