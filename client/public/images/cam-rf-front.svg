<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="旁轴相机正面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 机身 -->
  <rect x="130" y="84" width="140" height="140" rx="10" fill="#2b2118"/>
  <line x1="130" y1="108" x2="270" y2="108" stroke="#8c4a2f" stroke-width="1.5" opacity="0.7"/>
  <!-- 取景窗与测距窗 -->
  <rect x="146" y="96" width="44" height="30" rx="4" fill="#1a130d" stroke="#b98a2f" stroke-width="2"/>
  <rect x="214" y="100" width="26" height="20" rx="3" fill="#1a130d" stroke="#b98a2f" stroke-width="2"/>
  <text x="200" y="124" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="2" fill="#b98a2f">LEICA</text>
  <!-- 皮饰纹理 -->
  <g stroke="#8c4a2f" stroke-width="1.5" opacity="0.4">
    <line x1="142" y1="150" x2="142" y2="212"/><line x1="258" y1="150" x2="258" y2="212"/>
    <line x1="136" y1="180" x2="264" y2="180"/><line x1="136" y1="202" x2="264" y2="202"/>
  </g>
  <!-- 镜头 -->
  <circle cx="200" cy="160" r="32" fill="#2b2118" stroke="#b98a2f" stroke-width="3.5"/>
  <circle cx="200" cy="160" r="22" fill="#1a130d" stroke="#8c4a2f" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="13" fill="#0d0a07"/>
  <path d="M184 146 A22 22 0 0 1 206 138" fill="none" stroke="#b98a2f" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <text x="200" y="216" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">M3</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.04</text>
</svg>
