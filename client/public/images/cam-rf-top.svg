<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="旁轴相机顶面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 顶板 -->
  <rect x="118" y="108" width="164" height="92" rx="6" fill="#2b2118"/>
  <rect x="128" y="118" width="144" height="72" rx="4" fill="none" stroke="#8c4a2f" stroke-width="1.5" opacity="0.6"/>
  <!-- 倒片旋钮 -->
  <circle cx="142" cy="150" r="16" fill="#4a372a" stroke="#b98a2f" stroke-width="2"/>
  <circle cx="142" cy="150" r="6" fill="none" stroke="#b98a2f" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- 过片扳手 -->
  <path d="M258 150 L296 132" stroke="#4a372a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="258" cy="150" r="12" fill="#4a372a" stroke="#b98a2f" stroke-width="2"/>
  <!-- 快门速度盘 -->
  <circle cx="190" cy="154" r="22" fill="#2b2118" stroke="#b98a2f" stroke-width="2.5"/>
  <g stroke="#b98a2f" stroke-width="1.5">
    <line x1="190" y1="136" x2="190" y2="141"/><line x1="190" y1="167" x2="190" y2="172"/>
    <line x1="172" y1="154" x2="177" y2="154"/><line x1="203" y1="154" x2="208" y2="154"/>
  </g>
  <circle cx="190" cy="154" r="4" fill="#b98a2f"/>
  <!-- 机身刻字 -->
  <text x="200" y="176" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="2" fill="#b98a2f">LEICA M3</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.05</text>
</svg>
