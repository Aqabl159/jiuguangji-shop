<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="单反相机正面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 机身 -->
  <rect x="140" y="72" width="120" height="152" rx="10" fill="#2b2118"/>
  <!-- 五棱镜顶 -->
  <path d="M158 72 L160 48 L240 48 L242 72 Z" fill="#2b2118"/>
  <text x="200" y="63" text-anchor="middle" font-family="Courier New, monospace" font-size="9" letter-spacing="2" fill="#b98a2f">NIKON</text>
  <!-- 皮饰纹理 -->
  <g stroke="#8c4a2f" stroke-width="2" opacity="0.45">
    <line x1="152" y1="96" x2="152" y2="212"/><line x1="248" y1="96" x2="248" y2="212"/>
    <line x1="146" y1="140" x2="254" y2="140"/><line x1="146" y1="170" x2="254" y2="170"/>
  </g>
  <!-- 镜头 -->
  <circle cx="200" cy="146" r="44" fill="#2b2118" stroke="#b98a2f" stroke-width="4"/>
  <circle cx="200" cy="146" r="32" fill="#1a130d" stroke="#8c4a2f" stroke-width="2"/>
  <circle cx="200" cy="146" r="20" fill="#0d0a07"/>
  <path d="M176 124 A34 34 0 0 1 208 114" fill="none" stroke="#b98a2f" stroke-width="4" opacity="0.55" stroke-linecap="round"/>
  <!-- 快门拨盘 -->
  <rect x="236" y="44" width="18" height="8" rx="3" fill="#4a372a"/>
  <rect x="150" y="44" width="18" height="8" rx="3" fill="#4a372a"/>
  <text x="200" y="196" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">FM2</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.01</text>
</svg>
