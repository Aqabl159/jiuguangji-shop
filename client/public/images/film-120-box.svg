<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="120 胶卷包装盒剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 盒体 -->
  <rect x="136" y="82" width="128" height="136" rx="4" fill="#4a6b3a"/>
  <rect x="144" y="90" width="112" height="120" rx="2" fill="none" stroke="#f6ecd8" stroke-width="1.5"/>
  <text x="200" y="112" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="2" fill="#f6ecd8">FUJIFILM</text>
  <text x="200" y="160" text-anchor="middle" font-family="Courier New, monospace" font-size="44" font-weight="bold" fill="#f6ecd8">100</text>
  <rect x="156" y="172" width="88" height="18" rx="2" fill="#f6ecd8"/>
  <text x="200" y="185" text-anchor="middle" font-family="Courier New, monospace" font-size="9" letter-spacing="1" fill="#4a6b3a">VELVIA 120</text>
  <!-- 铝箔封条 -->
  <circle cx="200" cy="200" r="4" fill="#b98a2f"/>
  <text x="200" y="214" text-anchor="middle" font-family="Courier New, monospace" font-size="7" fill="#e8d9a8">PROFESSIONAL</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.13</text>
</svg>
