<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="双反相机正面剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 机身 -->
  <rect x="140" y="74" width="120" height="150" rx="8" fill="#2b2118"/>
  <!-- 取景遮光罩 -->
  <path d="M172 74 L172 56 L228 56 L228 74 Z" fill="#2b2118"/>
  <!-- 上下双镜头 -->
  <circle cx="200" cy="112" r="30" fill="#2b2118" stroke="#b98a2f" stroke-width="3"/>
  <circle cx="200" cy="112" r="20" fill="#1a130d" stroke="#8c4a2f" stroke-width="1.5"/>
  <circle cx="200" cy="112" r="11" fill="#0d0a07"/>
  <circle cx="200" cy="186" r="30" fill="#2b2118" stroke="#b98a2f" stroke-width="3"/>
  <circle cx="200" cy="186" r="20" fill="#1a130d" stroke="#8c4a2f" stroke-width="1.5"/>
  <circle cx="200" cy="186" r="11" fill="#0d0a07"/>
  <path d="M184 98 A22 22 0 0 1 206 90" fill="none" stroke="#b98a2f" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- 铭牌 -->
  <rect x="160" y="144" width="80" height="18" rx="3" fill="#4a372a"/>
  <text x="200" y="157" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#e8d9a8">ROLLEI</text>
  <text x="200" y="216" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">2.8F</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.06</text>
