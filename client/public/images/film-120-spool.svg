<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="120 胶卷卷轴剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- 背纸卷 -->
  <rect x="148" y="128" width="104" height="44" rx="6" fill="#e8d9a8" stroke="#2b2118" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#2b2118">KODAK</text>
  <text x="200" y="162" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#2b2118">120 · 6×7</text>
  <!-- 两侧片轴法兰 -->
  <circle cx="144" cy="150" r="38" fill="#2b2118"/>
  <circle cx="144" cy="150" r="30" fill="none" stroke="#8c4a2f" stroke-width="2"/>
  <circle cx="144" cy="150" r="12" fill="#1a130d" stroke="#b98a2f" stroke-width="2.5"/>
  <circle cx="256" cy="150" r="38" fill="#2b2118"/>
  <circle cx="256" cy="150" r="30" fill="none" stroke="#8c4a2f" stroke-width="2"/>
  <circle cx="256" cy="150" r="12" fill="#1a130d" stroke="#b98a2f" stroke-width="2.5"/>
  <!-- 轴心 -->
  <rect x="138" y="144" width="124" height="12" rx="4" fill="#4a372a"/>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.12</text>
</svg>
