  <path d="M200 232 C 242 240 252 206 274 200" fill="none" stroke="#e8d9a8" stroke-width="7" stroke-linecap="round"/>
  <path d="M200 232 C 242 240 252 206 274 200" fill="none" stroke="#8c4a2f" stroke-width="1.5" opacity="0.6"/>
  <g fill="#f6ecd8">
