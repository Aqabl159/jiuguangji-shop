  <text x="200" y="140" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#2b2118">HP5</text>
  <!-- 片轴 -->
  <circle cx="200" cy="236" r="10" fill="#4a372a" stroke="#b98a2f" stroke-width="2"/>
