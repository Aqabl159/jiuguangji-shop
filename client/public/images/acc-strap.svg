<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="真皮相机肩带剪影">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.25 0 0 0 0.05 0"/></filter>
    <pattern id="holes" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="4" height="8" fill="#f6ecd8"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6ecd8"/>
  <rect width="400" height="300" filter="url(#grain)"/>
  <!-- S 形肩带 -->
  <path d="M78 84 C 140 130 120 190 188 164 C 252 140 262 84 326 108" fill="none" stroke="#8c4a2f" stroke-width="30" stroke-linecap="round"/>
  <!-- 皮革纹理线 -->
  <path d="M78 84 C 140 130 120 190 188 164 C 252 140 262 84 326 108" fill="none" stroke="#4a372a" stroke-width="2" opacity="0.5"/>
  <!-- 缝线 -->
  <path d="M78 84 C 140 130 120 190 188 164 C 252 140 262 84 326 108" fill="none" stroke="#b98a2f" stroke-width="2" stroke-dasharray="7 7" opacity="0.9"/>
  <!-- 金属卡扣 -->
  <rect x="58" y="72" width="40" height="30" rx="4" fill="none" stroke="#b98a2f" stroke-width="6"/>
  <line x1="78" y1="72" x2="78" y2="102" stroke="#b98a2f" stroke-width="6"/>
  <rect x="306" y="92" width="40" height="30" rx="4" fill="none" stroke="#b98a2f" stroke-width="6"/>
  <line x1="326" y1="92" x2="326" y2="122" stroke="#b98a2f" stroke-width="6"/>
  <text x="200" y="230" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="2" fill="#2b2118">GENUINE LEATHER</text>
  <text x="200" y="248" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#9c8d78">手作植鞣革</text>
  <!-- 胶卷齿孔条 -->
  <rect y="276" width="400" height="24" fill="#2b2118"/>
  <rect y="279" width="400" height="8" fill="url(#holes)"/>
  <rect y="289" width="400" height="8" fill="url(#holes)"/>
  <text x="16" y="26" font-family="Courier New, monospace" font-size="11" fill="#9c8d78">JGJ-NO.17</text>
</svg>
